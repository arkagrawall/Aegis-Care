    <div data-hf-id="hf-bfro" class="cg" id="cap0"><span data-hf-id="hf-4sh9">Your parents deserve family,</span></div>
<div data-hf-id="hf-c7fh" class="cg" id="cap1"><span data-hf-id="hf-2h57">even on the days you can't be</span></div>
<div data-hf-id="hf-id5a" class="cg" id="cap2"><span data-hf-id="hf-yqit">there.</span></div>
<div data-hf-id="hf-mb9b" class="cg" id="cap3"><span data-hf-id="hf-hiue">Meet Samarth Saathi:</span></div>
<div data-hf-id="hf-q9dc" class="cg" id="cap4"><span data-hf-id="hf-toay">your parent's Samarth Care Manager,</span></div>
<div data-hf-id="hf-r115" class="cg" id="cap5"><span data-hf-id="hf-60xi">now on their phone.</span></div>
<div data-hf-id="hf-uz56" class="cg" id="cap6"><span data-hf-id="hf-vush">It lives right on Samarth's website.</span></div>
<div data-hf-id="hf-yx97" class="cg" id="cap7"><span data-hf-id="hf-m09y">Saathi checks in every day,</span></div>
<div data-hf-id="hf-2vd8" class="cg" id="cap8"><span data-hf-id="hf-5tuh">rings at every medicine time,</span></div>
<div data-hf-id="hf-5umt" class="cg" id="cap9"><span data-hf-id="hf-drct">and brings help with one press.</span></div>
<div data-hf-id="hf-ostb" class="cg" id="cap10"><span data-hf-id="hf-lyew">Choose a plan:</span></div>
<div data-hf-id="hf-kupa" class="cg" id="cap11"><span data-hf-id="hf-977u">two ninety-nine a month,</span></div>
<div data-hf-id="hf-gwl9" class="cg" id="cap12"><span data-hf-id="hf-oi8g">or two thousand nine ninety-nine a year.</span></div>
<div data-hf-id="hf-g4xg" class="cg" id="cap13"><span data-hf-id="hf-9o2v">Then add your parent's name,</span></div>
<div data-hf-id="hf-3mez" class="cg" id="cap14"><span data-hf-id="hf-19am">their city,</span></div>
<div data-hf-id="hf-zoay" class="cg" id="cap15"><span data-hf-id="hf-6gt4">and the language Saathi should speak.</span></div>
<div data-hf-id="hf-vq6x" class="cg" id="cap16"><span data-hf-id="hf-4zqb">Pay securely with Razorpay.</span></div>
<div data-hf-id="hf-uyj4" class="cg" id="cap17"><span data-hf-id="hf-e6jx">In seconds,</span></div>
<div data-hf-id="hf-ig0n" class="cg" id="cap18"><span data-hf-id="hf-l4qm">Samarth assigns a Care Manager in your</span></div>
<div data-hf-id="hf-caau" class="cg" id="cap19"><span data-hf-id="hf-jwuu">parent's city,</span></div>
<div data-hf-id="hf-odwa" class="cg" id="cap20"><span data-hf-id="hf-ixcj">and gives you a one-time Saathi code,</span></div>
<div data-hf-id="hf-sc0b" class="cg" id="cap21"><span data-hf-id="hf-ioli">ready to send on WhatsApp.</span></div>
<div data-hf-id="hf-hgio" class="cg" id="cap22"><span data-hf-id="hf-l19d">On your parent's phone,</span></div>
<div data-hf-id="hf-i86h" class="cg" id="cap23"><span data-hf-id="hf-bofd">Saathi opens with a short,</span></div>
<div data-hf-id="hf-9kam" class="cg" id="cap24"><span data-hf-id="hf-15nu">friendly welcome,</span></div>
<div data-hf-id="hf-dien" class="cg" id="cap25"><span data-hf-id="hf-pyyo">and can read every screen aloud.</span></div>
<div data-hf-id="hf-4uis" class="cg" id="cap26"><span data-hf-id="hf-fo57">Setup takes a minute.</span></div>
<div data-hf-id="hf-5m6l" class="cg" id="cap27"><span data-hf-id="hf-ewel">Choose the language,</span></div>
<div data-hf-id="hf-fthu" class="cg" id="cap28"><span data-hf-id="hf-9e80">type their name,</span></div>
<div data-hf-id="hf-jrlv" class="cg" id="cap29"><span data-hf-id="hf-sf0a">and enter the Saathi code.</span></div>
<div data-hf-id="hf-c8yd" class="cg" id="cap30"><span data-hf-id="hf-a2sy">The phone is now linked to their</span></div>
<div data-hf-id="hf-99os" class="cg" id="cap31"><span data-hf-id="hf-h7hv">Care Manager.</span></div>
<div data-hf-id="hf-k56f" class="cg" id="cap32"><span data-hf-id="hf-wa5s">The home screen shows one thing at</span></div>
<div data-hf-id="hf-g72e" class="cg" id="cap33"><span data-hf-id="hf-xsk9">a time:</span></div>
<div data-hf-id="hf-ouy9" class="cg" id="cap34"><span data-hf-id="hf-a2d3">how are you today,</span></div>
<div data-hf-id="hf-o3ag" class="cg" id="cap35"><span data-hf-id="hf-zzc8">or the next medicine,</span></div>
<div data-hf-id="hf-wr6b" class="cg" id="cap36"><span data-hf-id="hf-6zuh">with a countdown.</span></div>
<div data-hf-id="hf-st2a" class="cg" id="cap37"><span data-hf-id="hf-67oy">It updates by itself,</span></div>
<div data-hf-id="hf-ilr1" class="cg" id="cap38"><span data-hf-id="hf-d2vo">all day.</span></div>
<div data-hf-id="hf-hu38" class="cg" id="cap39"><span data-hf-id="hf-o3hn">At medicine time,</span></div>
<div data-hf-id="hf-3ago" class="cg" id="cap40"><span data-hf-id="hf-i4up">the phone rings,</span></div>
<div data-hf-id="hf-424h" class="cg" id="cap41"><span data-hf-id="hf-u212">even when it's locked.</span></div>
<div data-hf-id="hf-808i" class="cg" id="cap42"><span data-hf-id="hf-hcof">One big button:</span></div>
<div data-hf-id="hf-bycj" class="cg" id="cap43"><span data-hf-id="hf-i6dy">I took it.</span></div>
<div data-hf-id="hf-ogv0" class="cg" id="cap44"><span data-hf-id="hf-5md8">A missed dose reaches the Care Manager</span></div>
<div data-hf-id="hf-p8it" class="cg" id="cap45"><span data-hf-id="hf-xa42">the same day.</span></div>
<div data-hf-id="hf-t6mu" class="cg" id="cap46"><span data-hf-id="hf-nuj6">Every day,</span></div>
<div data-hf-id="hf-zccn" class="cg" id="cap47"><span data-hf-id="hf-5ix0">Saathi calls.</span></div>
<div data-hf-id="hf-9n9c" class="cg" id="cap48"><span data-hf-id="hf-sxks">It's a real conversation:</span></div>
<div data-hf-id="hf-cmix" class="cg" id="cap49"><span data-hf-id="hf-ii0d">it asks about sleep and food,</span></div>
<div data-hf-id="hf-n3jn" class="cg" id="cap50"><span data-hf-id="hf-vlwb">listens to worries,</span></div>
<div data-hf-id="hf-j5fm" class="cg" id="cap51"><span data-hf-id="hf-mdn7">and flags anything serious.</span></div>
<div data-hf-id="hf-czpt" class="cg" id="cap52"><span data-hf-id="hf-tsy8">In an emergency,</span></div>
<div data-hf-id="hf-c820" class="cg" id="cap53"><span data-hf-id="hf-u76p">hold SOS for three seconds.</span></div>
<div data-hf-id="hf-89xz" class="cg" id="cap54"><span data-hf-id="hf-hqn1">The Care Manager is alerted at once,</span></div>
<div data-hf-id="hf-4bty" class="cg" id="cap55"><span data-hf-id="hf-cg9f">with the phone's location.</span></div>
<div data-hf-id="hf-0dpx" class="cg" id="cap56"><span data-hf-id="hf-z5e7">Care Managers get one short list each</span></div>
<div data-hf-id="hf-zm24" class="cg" id="cap57"><span data-hf-id="hf-prer">morning:</span></div>
<div data-hf-id="hf-vny3" class="cg" id="cap58"><span data-hf-id="hf-10ya">who needs a call today,</span></div>
<div data-hf-id="hf-pi8a" class="cg" id="cap59"><span data-hf-id="hf-1opw">and why,</span></div>
<div data-hf-id="hf-kkzy" class="cg" id="cap60"><span data-hf-id="hf-a6i2">with readings,</span></div>
<div data-hf-id="hf-oj3z" class="cg" id="cap61"><span data-hf-id="hf-jeq6">medicines and every call in one place.</span></div>
<div data-hf-id="hf-fv84" class="cg" id="cap62"><span data-hf-id="hf-2w62">And families receive a calm weekly summary,</span></div>
