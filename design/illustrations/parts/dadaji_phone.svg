  <!-- head -->
  <ellipse cx="41.5" cy="47" rx="3.2" ry="4.6" fill="#C98B62"/>
  <ellipse cx="60" cy="44" rx="18" ry="20" fill="#E2A57E"/>
  <path d="M68,25.5 C75,29 78,37 78,44 C78,55 72,62 64,64 C70,57 72,49 71,41 C70.5,35 69.5,30 68,25.5Z" fill="#CD906A"/>
  <!-- white hair at the sides, bald on top -->
  <path d="M42.5,46 C40,35 43.5,29 49,26.5 C47,32 46.5,39 47.5,46Z" fill="#EEF0F0"/>
  <path d="M77,40 C78,33 75,28 70.5,26 C72.5,31 73,36 73,41Z" fill="#D8DDDE"/>
