<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 250">
  <!-- Dadaji: indigo kurta, cream pyjama, white hair at the sides and a white moustache, glasses.
       Phone held to his ear with his left hand (our right), walking stick in the other. Feet at y=244. -->
  <!-- walking stick (behind) -->
  <path d="M33,124 L27,240" fill="none" stroke="#6B4F3A" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M33,124 C33,117 25,116 23,121" fill="none" stroke="#6B4F3A" stroke-width="3.6" stroke-linecap="round"/>
  <!-- neck -->
  <rect x="53" y="60" width="14" height="14" rx="4" fill="#C98B62"/>
  <!-- pyjama legs -->
  <path d="M41,164 L59,164 L57,236 L45,236Z" fill="#F4EBDD"/>
  <path d="M61,164 L80,164 L76,236 L64,236Z" fill="#E3D6C2"/>
  <!-- feet -->
  <ellipse cx="50" cy="240" rx="9" ry="4" fill="#6B4F3A"/>
  <ellipse cx="72" cy="240" rx="9" ry="4" fill="#5A4130"/>
  <!-- kurta -->
  <path d="M40,77 C46,70 74,70 80,77 C83,104 85,136 87,170 L33,170 C35,136 37,104 40,77Z" fill="#3F5BA9"/>
  <path d="M73,73 C77,74 80,77 80,77 C83,104 85,136 87,170 L76,170 C76,140 75,108 73,73Z" fill="#344C8F"/>
  <path d="M59,74 L61,74 L61,104 L59,104Z" fill="#F4EBDD"/>
  <circle cx="60" cy="82" r="1.4" fill="#E8B04B"/>
  <circle cx="60" cy="90" r="1.4" fill="#E8B04B"/>
  <circle cx="60" cy="98" r="1.4" fill="#E8B04B"/>
  <!-- left arm (our left) down to the stick -->
  <path d="M41,78 C35,84 32,100 31,118 L40,119 C41,104 43,92 46,84Z" fill="#3F5BA9"/>
  <ellipse cx="34.5" cy="124" rx="5.6" ry="5.4" fill="#E2A57E"/>
  <!-- right arm up to the ear, holding the phone -->
  <path d="M77,79 C85,84 93,96 94,108 L86,111 C84,100 80,92 74,86Z" fill="#344C8F"/>
  <path d="M94,106 C92,90 86,74 80,62 L73,66 C79,77 84,92 86,110Z" fill="#E2A57E"/>
  <rect x="71" y="42" width="9.5" height="19" rx="2.4" fill="#2F3A45" transform="rotate(-14 75.75 51.5)"/>
