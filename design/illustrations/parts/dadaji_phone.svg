  <circle cx="66.2" cy="46" r="1.8" fill="#2B2B33"/>
  <circle cx="52.8" cy="46" r="5" fill="none" stroke="#5A4130" stroke-width="1.3"/>
  <circle cx="66.2" cy="46" r="5" fill="none" stroke="#5A4130" stroke-width="1.3"/>
  <path d="M57.8,45.6 q1.7,-1 3.4,0" fill="none" stroke="#5A4130" stroke-width="1.3"/>
  <ellipse cx="49" cy="53" rx="3.2" ry="2" fill="#F07862" opacity="0.3"/>
