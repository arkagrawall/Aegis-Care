  <div id="root" data-composition-id="captions" data-width="1920" data-height="1080">
    <div class="cg" id="cap0"><span>Across India,</span></div>
<div class="cg" id="cap1"><span>millions of older people live on</span></div>
<div class="cg" id="cap2"><span>their own at home.</span></div>
<div class="cg" id="cap3"><span>When their health starts to slip,</span></div>
<div class="cg" id="cap4"><span>the warning signs often appear days</span></div>
<div class="cg" id="cap5"><span>before an emergency:</span></div>
<div class="cg" id="cap6"><span>fewer steps,</span></div>
<div class="cg" id="cap7"><span>poorer sleep,</span></div>
<div class="cg" id="cap8"><span>a missed medicine.</span></div>
<div class="cg" id="cap9"><span>But no one is watching closely</span></div>
<div class="cg" id="cap10"><span>enough to notice.</span></div>
<div class="cg" id="cap11"><span>Aegis Saathi is an early-warning system</span></div>
<div class="cg" id="cap12"><span>for seniors living at home.</span></div>
<div class="cg" id="cap13"><span>It connects the senior's phone,</span></div>
<div class="cg" id="cap14"><span>their care coordinator,</span></div>
<div class="cg" id="cap15"><span>and their family,</span></div>
<div class="cg" id="cap16"><span>so the right person knows who</span></div>
<div class="cg" id="cap17"><span>needs care today.</span></div>
<div class="cg" id="cap18"><span>It starts with a simple phone</span></div>
<div class="cg" id="cap19"><span>app for the senior.</span></div>
<div class="cg" id="cap20"><span>Big buttons,</span></div>
<div class="cg" id="cap21"><span>plain words,</span></div>
<div class="cg" id="cap22"><span>and the whole app switches between</span></div>
<div class="cg" id="cap23"><span>Hindi and English with one tap.</span></div>
<div class="cg" id="cap24"><span>Each day they tell Saathi how</span></div>
<div class="cg" id="cap25"><span>they feel and whether they took</span></div>
<div class="cg" id="cap26"><span>their medicine.</span></div>
<div class="cg" id="cap27"><span>One tap,</span></div>
<div class="cg" id="cap28"><span>and their care manager is told</span></div>
<div class="cg" id="cap29"><span>right away.</span></div>
<div class="cg" id="cap30"><span>Saathi also calls them.</span></div>
<div class="cg" id="cap31"><span>The check-in call asks about their</span></div>
<div class="cg" id="cap32"><span>health,</span></div>
<div class="cg" id="cap33"><span>medicine,</span></div>
<div class="cg" id="cap34"><span>sleep and appetite,</span></div>
<div class="cg" id="cap35"><span>and understands everyday answers.</span></div>
<div class="cg" id="cap36"><span>Here,</span></div>
<div class="cg" id="cap37"><span>Kamla says she feels dizzy and</span></div>
<div class="cg" id="cap38"><span>weak,</span></div>
<div class="cg" id="cap39"><span>and slept only four hours.</span></div>
<div class="cg" id="cap40"><span>Now the care coordinator's view.</span></div>
<div class="cg" id="cap41"><span>The Today list puts everyone in</span></div>
<div class="cg" id="cap42"><span>order of urgency:</span></div>
<div class="cg" id="cap43"><span>urgent,</span></div>
<div class="cg" id="cap44"><span>needs attention,</span></div>
<div class="cg" id="cap45"><span>watch,</span></div>
<div class="cg" id="cap46"><span>and stable.</span></div>
<div class="cg" id="cap47"><span>Each person comes with the one</span></div>
<div class="cg" id="cap48"><span>reason they are on the list.</span></div>
<div class="cg" id="cap49"><span>Open a record,</span></div>
<div class="cg" id="cap50"><span>and Saathi explains itself.</span></div>
<div class="cg" id="cap51"><span>Sita's steps are eighty-five percent below</span></div>
<div class="cg" id="cap52"><span>her own normal,</span></div>
<div class="cg" id="cap53"><span>her activity has fallen for five</span></div>
<div class="cg" id="cap54"><span>days,</span></div>
<div class="cg" id="cap55"><span>and in a call she mentioned</span></div>
<div class="cg" id="cap56"><span>pain.</span></div>
<div class="cg" id="cap57"><span>Each reason says where it came</span></div>
<div class="cg" id="cap58"><span>from.</span></div>
<div class="cg" id="cap59"><span>Readings are compared with each person's</span></div>
<div class="cg" id="cap60"><span>own fourteen-day average,</span></div>
<div class="cg" id="cap61"><span>not a one-size-fits-all rule,</span></div>
<div class="cg" id="cap62"><span>with trends for steps,</span></div>
<div class="cg" id="cap63"><span>heart rate,</span></div>
<div class="cg" id="cap64"><span>oxygen,</span></div>
<div class="cg" id="cap65"><span>blood pressure,</span></div>
<div class="cg" id="cap66"><span>sugar,</span></div>
<div class="cg" id="cap67"><span>weight and sleep.</span></div>
<div class="cg" id="cap68"><span>Every check-in call lands in the</span></div>
<div class="cg" id="cap69"><span>record.</span></div>
<div class="cg" id="cap70"><span>The coordinator sees what Saathi heard,</span></div>
<div class="cg" id="cap71"><span>the full conversation,</span></div>
<div class="cg" id="cap72"><span>and a flag when it thinks</span></div>
<div class="cg" id="cap73"><span>they should follow up.</span></div>
<div class="cg" id="cap74"><span>Emergencies come first.</span></div>
<div class="cg" id="cap75"><span>When a senior holds the SOS</span></div>
<div class="cg" id="cap76"><span>button,</span></div>
<div class="cg" id="cap77"><span>the alert reaches the coordinator in</span></div>
<div class="cg" id="cap78"><span>seconds,</span></div>
<div class="cg" id="cap79"><span>and stays at the top of</span></div>
<div class="cg" id="cap80"><span>every page until someone confirms it,</span></div>
<div class="cg" id="cap81"><span>or marks it as a false</span></div>
<div class="cg" id="cap82"><span>alarm.</span></div>
<div class="cg" id="cap83"><span>The phone can also notice a</span></div>
<div class="cg" id="cap84"><span>fall.</span></div>
<div class="cg" id="cap85"><span>After a hard impact followed by</span></div>
<div class="cg" id="cap86"><span>stillness,</span></div>
<div class="cg" id="cap87"><span>it asks the senior if they</span></div>
<div class="cg" id="cap88"><span>are okay.</span></div>
<div class="cg" id="cap89"><span>If they ask for help,</span></div>
<div class="cg" id="cap90"><span>or don't answer within thirty seconds,</span></div>
<div class="cg" id="cap91"><span>an emergency alert is raised automatically.</span></div>
<div class="cg" id="cap92"><span>After acting,</span></div>
<div class="cg" id="cap93"><span>the coordinator logs a quick follow-up</span></div>
<div class="cg" id="cap94"><span>and says whether the alert was</span></div>
<div class="cg" id="cap95"><span>useful.</span></div>
<div class="cg" id="cap96"><span>Saathi learns from these ratings,</span></div>
<div class="cg" id="cap97"><span>so reasons that rarely matter count</span></div>
<div class="cg" id="cap98"><span>for less over time.</span></div>
<div class="cg" id="cap99"><span>Operations teams see the whole programme</span></div>
<div class="cg" id="cap100"><span>at a glance:</span></div>
<div class="cg" id="cap101"><span>people monitored,</span></div>
<div class="cg" id="cap102"><span>who needs attention today,</span></div>
<div class="cg" id="cap103"><span>open emergencies,</span></div>
<div class="cg" id="cap104"><span>response times,</span></div>
<div class="cg" id="cap105"><span>and the workload of every coordinator</span></div>
<div class="cg" id="cap106"><span>and city.</span></div>
<div class="cg" id="cap107"><span>Accuracy is measured,</span></div>
<div class="cg" id="cap108"><span>not claimed.</span></div>
<div class="cg" id="cap109"><span>On a simulated validation group,</span></div>
<div class="cg" id="cap110"><span>Saathi caught all thirty decline cases,</span></div>
<div class="cg" id="cap111"><span>a median of nine days early,</span></div>
<div class="cg" id="cap112"><span>with fewer than one false alert</span></div>
<div class="cg" id="cap113"><span>per coordinator each week.</span></div>
<div class="cg" id="cap114"><span>The limits are listed right on</span></div>
<div class="cg" id="cap115"><span>the page.</span></div>
<div class="cg" id="cap116"><span>Families get a calm,</span></div>
<div class="cg" id="cap117"><span>simple view,</span></div>
<div class="cg" id="cap118"><span>shared only with the senior's consent:</span></div>
<div class="cg" id="cap119"><span>how they are today,</span></div>
<div class="cg" id="cap120"><span>their steps and medicines this week,</span></div>
<div class="cg" id="cap121"><span>and who their care manager is.</span></div>
<div class="cg" id="cap122"><span>No scores,</span></div>
<div class="cg" id="cap123"><span>and no medical detail.</span></div>
<div class="cg" id="cap124"><span>Aegis Saathi.</span></div>
<div class="cg" id="cap125"><span>See who needs care today,</span></div>
<div class="cg" id="cap126"><span>before it becomes an emergency.</span></div>
  </div>
