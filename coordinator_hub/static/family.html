const MIC = '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5,11a6.5,6.5 0 0 0 13,0"/><path d="M12,17.5V21"/>', PLAY = '<path d="M8,5.5v13l10.5-6.5z"/>', STOP = '<rect x="6.5" y="6.5" width="11" height="11" rx="2"/>';

const t = (k) => T[lang][k] || T.en[k];

const INFO = '<circle cx="12" cy="12" r="9"/><path d="M12,11v5.5"/><path d="M12,7.8h.01"/>', OUT = '<path d="M14,4.5H18.5V19.5H14"/><path d="M10,8l-4,4 4,4"/><path d="M6,12h9"/>';
const app = document.getElementById("app");
const loc = () => (lang === "hi" ? "hi-IN" : "en-IN");
const seg = () => `<div class="seg" role="group" aria-label="${t("lang")}" id="seg"><button type="button" data-l="hi" aria-pressed="${lang === "hi"}" lang="hi">हिंदी</button><button type="button" data-l="en" aria-pressed="${lang === "en"}" lang="en">English</button></div>`;
const bind = () => { const s = document.getElementById("seg"); if (s) s.onclick = (e) => { const b = e.target.closest("button"); if (b && b.dataset.l !== lang) { lang = b.dataset.l; localStorage.setItem("aegis_lang", lang); document.documentElement.lang = lang; data ? show() : login(); } }; };
const top = (right) => `<div class="bar-top"><div class="brand" style="padding:0"><div class="mark">${ico(LOGO)}</div><span>${t("brand")}<small>${t("forFamily")}</small></span></div>${right}</div>`;
// last 7 days, oldest first, ending today
const days = () => Array.from({ length: 7 }, (_, i) => { const d = new Date(); d.setDate(d.getDate() - (6 - i)); return d.toLocaleDateString(loc(), { weekday: "short" }); });

function login(errKey) {
  document.title = `${t("forFamily")} · ${t("brand")}`;
  firstShow = true; app.classList.remove("enter");
  const canPaste = !!(navigator.clipboard && navigator.clipboard.readText);
  app.innerHTML = `${top(seg())}
    <div class="card pad" style="margin-top:8px"><img class="fam-ill" src="/static/illustrations/family_phone.svg" alt="" width="360" height="300" decoding="async"><h1 style="font-size:26px">${t("title")}</h1><p class="muted" style="margin:6px 0 20px">${t("sub")}</p>
    <form id="ff" novalidate>
      <label class="field"><span class="label">${t("code")}</span><span class="input-wrap">
        <input class="input" id="fc" placeholder="FAM-ABC123" type="text" inputmode="text" autocomplete="one-time-code" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-describedby="fch ferr" ${errKey ? 'aria-invalid="true"' : ""}>
        ${canPaste ? `<button type="button" class="btn quiet" id="fp" style="position:absolute;right:2px;top:2px;min-height:44px">${t("paste")}</button>` : ""}</span>
        <span class="help" id="fch">${t("codeHelp")}</span>
        <span class="error ${errKey ? "" : "hidden"}" id="ferr" role="alert">${ico(ALERT, "s")}<span>${errKey ? t(errKey) : ""}</span></span></label>
      <button class="btn primary lg block" id="fg" type="submit" style="margin-top:20px">${t("go")}</button>
    </form></div>
    <p class="notice">${ico(INFO, "s")}<span>${t("note")}</span></p>`;
  bind();
  const fp = document.getElementById("fp");
  if (fp) fp.onclick = async () => { try { document.getElementById("fc").value = (await navigator.clipboard.readText()).trim().toUpperCase(); } catch (e) {} document.getElementById("fc").focus(); };
  document.getElementById("ff").onsubmit = async (ev) => {
    ev.preventDefault();
    const code = document.getElementById("fc").value.trim();
    if (!code) return login("empty");
    const b = document.getElementById("fg"); b.setAttribute("aria-busy", "true"); b.innerHTML = `<span class="spin"></span>${t("checking")}`;
    try {
      const r = await fetch("/api/auth/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ role: "family", id: code }) });
      if (!r.ok) return login("bad");
      token = (await r.json()).token; sessionStorage.setItem("fam_token", token); load();
    } catch (e) { login("bad"); }
  };
}
async function load(silent) {
  try {
    const r = await fetch("/api/family/overview", { headers: { Authorization: "Bearer " + token } });
    if (r.status === 401 || r.status === 403) { signOut(); return login("bad"); }
    if (!r.ok) throw new Error(r.status);
    data = await r.json(); show();
    if (!poll) poll = setInterval(() => { if (!document.hidden && !recorder) load(true); }, 60000);
  } catch (e) { if (!silent || !data) app.innerHTML = `${top("")}<div class="card pad"><p>${t("error")}</p></div>`; }
}
function signOut() { sessionStorage.removeItem("fam_token"); token = null; data = null; clearInterval(poll); poll = null; }
function show() {
  const d = data, steps = d.steps_7d || [], labels = days();
  const avg = steps.length ? steps.reduce((a, b) => a + b, 0) / steps.length : 0, mx = Math.max(...steps, avg, 1);
  const adh = /^\d+/.test(String(d.adherence_rate || "")) ? parseInt(d.adherence_rate, 10) : null;
  const calls = (d.calls_7d || []).slice().sort((a, b) => (a.date < b.date ? 1 : -1));
  document.title = `${d.name} · ${t("brand")}`;
  app.innerHTML = `${top(`<div class="row">${seg()}<button class="btn quiet icon" id="so" aria-label="${t("out")}" title="${t("out")}">${ico(OUT)}</button></div>`)}
    ${d.serious_alert ? `<div class="alert" role="alert">${ico(ALERT)}<span>${t("serious")}</span></div>` : ""}
    <section class="hello"><img class="hello-ill" src="/static/illustrations/family.svg" alt="" width="360" height="300" decoding="async"><p>${t("hello")}</p><h1>${esc(d.name)}</h1><span class="mood">${ico(CHECK, "s")}${t("today")}: ${esc(d.today_mood)}</span></section>
    <section class="card pad"><div class="overline">${t("summary")}</div><p style="margin-top:8px">${esc(lang === "hi" ? d.summary_hi : d.summary_en)}</p>
      <button class="btn secondary block" id="listen" style="margin-top:12px">${ico(PLAY, "s")}<span>${t("listen")}</span></button></section>
    <section class="card pad" id="vm"></section>
    <section class="card pad"><div class="overline">${t("glance")}</div>
      <div class="glance">
        <div class="g-ring">${Charts.donut({ segments: [{ label: t("taken"), value: adh ?? 0, color: "var(--viz-ok)" }, { label: t("missed"), value: adh === null ? 0 : 100 - adh, color: "var(--viz-track)" }],
          size: 108, thick: 14, center: adh === null ? "–" : adh + "%", label: `${adh ?? "–"}% ${t("medRing")}` })}<span>${t("medRing")}</span></div>
        <div class="g-num"><b class="num">${Number(d.avg_daily_steps || 0).toLocaleString(loc())}</b><span>${t("stepsAvg")}</span></div>
      </div>
      <div class="stat"><span>${t("lastCheck")}</span><b>${esc(d.last_checkin_time || "–")}</b></div>
      <div class="stat"><span>${t("care")}</span><b>${esc(d.coordinator_contact)}</b></div>
      ${d.coordinator_phone ? `<a class="btn secondary block" style="margin-top:12px" href="tel:${esc(String(d.coordinator_phone).replace(/\s/g, ""))}">${ico(PHONE, "s")}${t("callCm")}</a>` : ""}</section>
    <section class="card pad"><div class="overline">${t("steps")}</div>
      <div class="week ${firstShow ? "anim" : ""}" role="img" aria-label="${t("steps")}: ${steps.map((s, i) => `${labels[i]} ${s}`).join(", ")}">
        ${steps.map((s, i) => `<div class="col ${i === steps.length - 1 ? "today" : ""}"><b>${Number(s).toLocaleString(loc(), { notation: "compact" })}</b><i style="height:${Math.max(4, (s / mx) * 100)}%"></i><span>${i === steps.length - 1 ? t("today") : labels[i]}</span></div>`).join("")}</div></section>
    <section class="card pad"><div class="overline">${t("meds")}</div>
      <div class="meds ${firstShow ? "anim" : ""}">${(d.meds_7d || []).map((m, i) => { const st = m === null || m === undefined ? "none" : m ? "" : "miss", w = st === "none" ? t("noneDue") : m ? t("taken") : t("missed");
        return `<div class="d ${st}"><i title="${w}">${st === "none" ? "" : ico(m ? CHECK : X, "s")}</i><span>${i === 6 ? t("today") : labels[i]}</span><span class="sr-only">${w}</span></div>`; }).join("")}</div></section>
    <section class="card pad"><div class="overline">${t("saathi")}</div>

async function listen() {
  const b = document.getElementById("listen"), span = b.querySelector("span");
  const done = () => { b.removeAttribute("aria-busy"); span.textContent = t("listen"); };
  b.setAttribute("aria-busy", "true"); span.textContent = t("listening");
  try {
    const r = await (await fetch(`/api/family/voice-summary?lang=${lang}`, { headers: { Authorization: "Bearer " + token } })).json();
    player.onended = done; player.src = r.audio_url + "&token=" + encodeURIComponent(token); await player.play();
  } catch (e) { done(); }
}
// ---------------------------------------------------------------- family voice messages
async function loadMessages() {
  try { const r = await fetch("/api/family/voice-messages", { headers: { Authorization: "Bearer " + token } }); if (r.ok) { msgs = await r.json(); if (!recorder) drawVoice(); } } catch (e) {}
}
function drawVoice(note) {
  const box = document.getElementById("vm"); if (!box) return;
  const when = (ts) => new Date(ts * 1000).toLocaleString(loc(), { weekday: "short", hour: "numeric", minute: "2-digit" });
  const list = msgs.slice(0, 5).map((m) => `<li><button class="btn quiet icon" data-play="${esc(m.id)}" aria-label="${t("vmPlay")}">${ico(PLAY, "s")}</button>
      <span class="grow"><b>${esc(when(m.ts))}</b>${m.text ? `<span class="sm muted" style="display:block">“${esc(m.text)}”</span>` : ""}</span>
      <span class="sm ${m.played_at ? "" : "muted"}">${m.played_at ? ico(CHECK, "s") + " " + (m.played_how === "read_on_phone_call" ? t("vmRead") : t("vmPlayed")) : t("vmWait")}</span></li>`).join("");
  box.innerHTML = `<div class="overline">${t("vmTitle")}</div><p class="sm muted" style="margin:6px 0 12px">${t("vmSub")}</p>
    ${recorder ? `<div class="row" role="status" style="gap:10px"><span class="dot crit"></span><b class="num" id="vmSecs">0:${String(recSecs).padStart(2, "0")}</b></div>
      <div class="row" style="gap:8px;margin-top:10px"><button class="btn primary grow" id="vmStop">${ico(STOP, "s")}${t("vmStop")}</button><button class="btn secondary" id="vmCancel">${t("vmCancel")}</button></div>`
    : `<div class="row wrap" style="gap:8px"><label class="field grow"><span class="label">${t("vmName")}</span><input class="input" id="vmName" value="${esc(lsGet("vm_name"))}" autocomplete="name"></label>
        <label class="field grow"><span class="label">${t("vmRel")}</span><input class="input" id="vmRel" placeholder="${t("vmRelPh")}" value="${esc(lsGet("vm_rel"))}"></label></div>
      <button class="btn primary lg block" id="vmRec" style="margin-top:12px">${ico(MIC, "s")}${t("vmRec")}</button>`}
    ${note ? `<p class="sm" role="status" style="margin-top:10px">${esc(note)}</p>` : ""}
    <ul class="fcalls" style="margin-top:12px">${list || `<li><span class="muted sm">${t("vmNone")}</span></li>`}</ul>`;
  const rb = document.getElementById("vmRec"); if (rb) rb.onclick = startRec;
  const sb = document.getElementById("vmStop"); if (sb) sb.onclick = () => stopRec(true);
  const cb = document.getElementById("vmCancel"); if (cb) cb.onclick = () => stopRec(false);
  box.querySelectorAll("[data-play]").forEach((b) => (b.onclick = () => { player.onended = null; player.src = `/api/voice-messages/${b.dataset.play}.mp3?token=${encodeURIComponent(token)}`; player.play(); }));
}
async function startRec() {
  lsSet("vm_name", document.getElementById("vmName").value.trim()); lsSet("vm_rel", document.getElementById("vmRel").value.trim());
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }); }
  catch (e) { return drawVoice(t("vmNoMic")); }
  const type = ["audio/webm;codecs=opus", "audio/ogg;codecs=opus", "audio/mp4"].find((x) => window.MediaRecorder && MediaRecorder.isTypeSupported(x)) || "";
  recorder = new MediaRecorder(stream, type ? { mimeType: type } : undefined); chunks = []; recSecs = 0;
  recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  recorder.start(250); drawVoice();
  recTimer = setInterval(() => { recSecs++; const el = document.getElementById("vmSecs"); if (el) el.textContent = `0:${String(recSecs).padStart(2, "0")}`; if (recSecs >= 45) stopRec(true); }, 1000);
}
function stopRec(send) {
  if (!recorder) return;
  const r = recorder; clearInterval(recTimer);
  r.onstop = async () => {
    r.stream.getTracks().forEach((x) => x.stop()); recorder = null;
    if (!send) return drawVoice();
    drawVoice(t("vmSending"));
    const blob = new Blob(chunks, { type: r.mimeType || "audio/webm" });
    try {
      const q = `from_name=${encodeURIComponent(lsGet("vm_name"))}&relation=${encodeURIComponent(lsGet("vm_rel"))}`;
      const res = await fetch(`/api/family/voice-message?${q}`, { method: "POST", headers: { Authorization: "Bearer " + token, "Content-Type": blob.type }, body: blob });
      const j = await res.json(); if (!res.ok) throw new Error(j.detail || res.status);
      msgs.unshift(j); drawVoice(t("vmSent"));
    } catch (e) { drawVoice(String(e.message || e)); }
  };
  r.stop();
}
document.documentElement.lang = lang;
token ? load() : login();
})();
</script>
